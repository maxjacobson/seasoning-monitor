# CI runs `just check`: formatting, vet, gopls warnings, and tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2.0.0
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest
      - run: just check
